name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      repeat:
        description: "Run make check this many times in a row (reliability check)"
        default: "1"

# The only grant; no job raises it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # libecs-cpp 2.1.0 (provides ecs-cpp >= 2.0.0), fetched anonymously at this exact commit.
  LIBECS_CPP_REF: bd84b5a5bee05bed2006fc9ef9dbbfe3e58f9f7e

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: plain, sanitizer: "" }
          - { name: address+undefined, sanitizer: address }
          - { name: thread, sanitizer: thread }

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        # osslsigncode and Wine are read live by the installer tests
        # (test_MsiLiveTools, test_MsiLarge): a missing tool fails the test
        # rather than skipping it, see tests/ToolSupport.hpp.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config uuid-dev \
            osslsigncode wine wine64
          osslsigncode --version
          wine --version

      - name: Restore libecs-cpp
        id: ecs-cache
        uses: actions/cache@v4
        with:
          path: ~/ecs
          key: libecs-cpp-${{ env.LIBECS_CPP_REF }}-${{ runner.os }}-${{ env.ImageVersion }}

      - name: Build libecs-cpp
        if: steps.ecs-cache.outputs.cache-hit != 'true'
        run: |
          mkdir "$RUNNER_TEMP/libecs-cpp"
          cd "$RUNNER_TEMP/libecs-cpp"
          git init
          git fetch --depth 1 https://github.com/metaverse-systems/libecs-cpp.git "$LIBECS_CPP_REF"
          git checkout FETCH_HEAD
          ./autogen.sh
          ./configure --prefix="$HOME/ecs" --enable-tests=no
          make -j4
          make install

      - name: Use libecs-cpp
        run: |
          echo "PKG_CONFIG_PATH=$HOME/ecs/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/ecs/lib" >> "$GITHUB_ENV"
          if ! PKG_CONFIG_PATH="$HOME/ecs/lib/pkgconfig" pkg-config --atleast-version=2.0.0 ecs-cpp; then
            found=$(PKG_CONFIG_PATH="$HOME/ecs/lib/pkgconfig" pkg-config --modversion ecs-cpp 2>/dev/null || echo none)
            echo "::error::ecs-cpp >= 2.0.0 is required, found $found"
            exit 1
          fi

      - name: Lower address randomisation for the sanitizer runtime
        if: matrix.sanitizer != ''
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        run: |
          ./autogen.sh
          ./configure ${SANITIZER:+--enable-sanitizer=$SANITIZER}

      - name: Build
        run: make -j4

      - name: Test
        env:
          REPEAT: ${{ inputs.repeat || 1 }}
          # Headless Wine: do not try to install Mono or Gecko when the test
          # prefix is created.
          WINEDLLOVERRIDES: "mscoree,mshtml="
        run: |
          case "$REPEAT" in
            ''|*[!0-9]*|0)
              echo "repeat must be a positive integer, got '$REPEAT'" >&2
              exit 2
              ;;
          esac
          i=1
          while [ "$i" -le "$REPEAT" ]; do
            echo "make check run $i of $REPEAT"
            make check -j4 VERBOSE=1 || exit $?
            i=$((i + 1))
          done

      - name: Check the sanitizer runtime is linked
        if: matrix.sanitizer != ''
        run: |
          case "${{ matrix.sanitizer }}" in
            address) runtime=libasan ;;
            thread) runtime=libtsan ;;
          esac
          if ! ldd tests/.libs/test_NameParser | grep -q "$runtime"; then
            echo "::error::tests/.libs/test_NameParser is not linked with $runtime"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### test (${{ matrix.name }})"
            if [ -f tests/test-suite.log ]; then
              grep -E '^# (TOTAL|PASS|SKIP|XFAIL|FAIL|XPASS|ERROR):' tests/test-suite.log || true
              echo "Catch2 test cases:"
              grep -hE '^test cases:' tests/*.log | sort | uniq -c || true
            else
              echo "No test-suite.log found: the build failed before the tests ran."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f tests/test-suite.log ]; then
            grep -E '^(FAIL|ERROR): [^ ]+$' tests/test-suite.log | sort -u | while read -r line; do
              echo "::error::$line"
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done
          fi
          for f in tests/*.log; do
            [ -f "$f" ] || continue
            grep '^MALFORMED KNOWN GAP:' "$f" | while read -r line; do
              echo "::error::$line"
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done
            grep '^KNOWN GAP:' "$f" | while read -r line; do
              echo "::notice::$line"
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done
            grep '^STALE KNOWN GAP:' "$f" | while read -r line; do
              echo "::warning::$line"
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done
          done
          exit 0

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.name }}
          path: |
            tests/*.log
            tests/test-suite.log
          if-no-files-found: ignore

  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          version=$(clang --version | sed -n 's/.*clang version \([0-9][0-9]*\)\..*/\1/p' | head -n 1)
          if [ ! -f "$(clang -print-file-name=libclang_rt.fuzzer-x86_64.a)" ]; then
            sudo apt-get install -y "libclang-rt-${version}-dev"
          fi

      - name: Lower address randomisation for the sanitizer runtime
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Build the fuzzers
        run: tests/fuzz/build-fuzzers.sh "$RUNNER_TEMP/fuzz-build"

      - name: Fuzz each target for 60 seconds
        env:
          FUZZ_BUILD_DIR: ${{ runner.temp }}/fuzz-build
          FUZZ_OUT_DIR: ${{ runner.temp }}/fuzz-out
        run: tests/fuzz/run-fuzzers.sh 60 ${{ github.run_number }}

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          path: ${{ runner.temp }}/fuzz-out
          if-no-files-found: ignore
